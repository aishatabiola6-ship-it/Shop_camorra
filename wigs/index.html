<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbf4f1">
<title>Camorra Hair</title>
<meta name="description" content="Clickable wig shop app prototype with live order tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --s: 1; }
body {
    --bg: #fbf4f1;
    --surface: #ffffff;
    --surface-2: #f6e9ec;
    --line: #efdde2;
    --text: #2e1220;
    --muted: #93707e;
    --accent: #b8436f;
    --accent-soft: #f7dfe8;
    --accent-fg: #ffffff;
    --btn-bg: #3a1426;
    --btn-fg: #fff6f2;
    --tabbar: rgba(255, 255, 255, .88);
    --indicator: rgba(46, 18, 32, .8);
    --stage: radial-gradient(ellipse at 30% 20%, #fbe6ec 0%, #e9c3cf 100%);
}
body.dark {
    --bg: #120d10; --surface: #1c161a; --surface-2: #261d22; --line: #31262c;
    --text: #f6ece8; --muted: #a2909a; --accent: #e07aa0; --accent-soft: #3a1e2b; --accent-fg: #2a0b18;
    --btn-bg: #f6ece8; --btn-fg: #160c11; --tabbar: rgba(30, 24, 28, .88); --indicator: rgba(255,255,255,.85);
    --stage: radial-gradient(ellipse at 30% 20%, #2a1a22 0%, #0a0809 60%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: "Inter", system-ui, sans-serif; background: var(--stage) fixed; color: var(--text); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; }
.serif { font-family: "Playfair Display", Georgia, serif; }

/* ---------------- Stage: phone + code ---------------- */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 20px; }
.device-slot { flex: none; position: relative; }
.device { position: absolute; left: 0; top: 0; width: 414px; height: 868px; border-radius: 64px; padding: 12px; background: #1b1a1d; box-shadow: 0 0 0 2px #3a383d, 0 40px 120px rgba(0,0,0,.45), inset 0 0 0 2px #000; transform: scale(var(--s)); transform-origin: 0 0; }
.island { position: absolute; top: 24px; left: 50%; width: 120px; height: 34px; transform: translateX(-50%); background: #000; border-radius: 20px; z-index: 60; }
.app { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: var(--bg); isolation: isolate; }
.statusbar { position: absolute; inset: 0 0 auto 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font-size: 15px; font-weight: 600; z-index: 50; pointer-events: none; background: linear-gradient(var(--bg) 70%, transparent); }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 3px; background: var(--indicator); transform: translateX(-50%); z-index: 50; pointer-events: none; }

.editor { width: 540px; max-height: calc(100vh - 80px); background: #141317; border: 1px solid #2a282d; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.editor-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #2a282d; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.tab { margin-left: 14px; font: 500 12px "JetBrains Mono", monospace; color: #cfc7d2; background: #1d1b20; padding: 6px 12px; border-radius: 6px; }
.code { flex: 1; overflow: hidden; font: 12px/1.65 "JetBrains Mono", monospace; color: #d8d2db; padding: 14px 0; counter-reset: ln; }
.code .l { display: block; white-space: pre; padding-right: 16px; }
.code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 44px; padding-right: 16px; text-align: right; color: #55505a; }
.tk-k { color: #ff7ab2; } .tk-s { color: #f6c177; } .tk-n { color: #9ccfd8; } .tk-c { color: #6e6a76; font-style: italic; } .tk-p { color: #c4a7e7; }
@media (max-width: 1100px) { .editor { display: none; } }
.play { position: fixed; left: 20px; bottom: 20px; padding: 10px 16px; border-radius: 999px; background: #fff; color: #111; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 100; }
body.demo .play { display: none; }

/* ---------------- Screens ---------------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); transform: translateX(100%); transition: transform 450ms cubic-bezier(.2,.8,.2,1), opacity 450ms; z-index: 1; }
.screen.active { transform: none; z-index: 3; }
.screen.prev { transform: translateX(-25%); opacity: .5; z-index: 2; }
.scroll { flex: 1; overflow-y: auto; padding: 60px 18px 130px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.icon-btn { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.icon-btn svg { width: 20px; height: 20px; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 700; display: grid; place-items: center; transition: transform 200ms; }
.badge:empty { display: none; }
.badge.bump { transform: scale(1.4); }
.title-sm { font-size: 13px; color: var(--muted); }
.title-lg { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.h-screen { font-size: 22px; font-weight: 600; flex: 1; }
.h-screen small { display: block; font: 500 12px "Inter", sans-serif; color: var(--muted); margin-top: 2px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 0 10px; }

/* Splash */
.splash { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 45%, #f6d3df 0%, var(--bg) 70%); transition: opacity 600ms, visibility 600ms; }
body.dark .splash { background: radial-gradient(circle at 50% 45%, #3a1a2a 0%, var(--bg) 65%); }
.splash.hide { opacity: 0; visibility: hidden; }
.logo { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
.logo em { font-style: italic; color: var(--accent); }
.splash p { margin-top: 8px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

/* Login */
.login-hero { position: relative; height: 270px; border-radius: 28px; overflow: hidden; margin-bottom: 22px; background: #e9dcd6; }
.login-hero video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.login-hero .brand { position: absolute; left: 18px; bottom: 16px; color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 16px rgba(0,0,0,.35); }
.login-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(40,10,25,.55), transparent 55%); }
.login-hero .brand { z-index: 2; }
.login-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.login-sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 6px 0 20px; }
.login-sub b { color: var(--text); }
.auth { width: 100%; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px; margin-bottom: 10px; transition: transform 150ms; }
.auth:active { transform: scale(.97); }
.auth svg { width: 20px; height: 20px; }
.auth.apple { background: #000; color: #fff; }
body.dark .auth.apple { background: #fff; color: #000; }
.auth.google { background: #fff; color: #1f1f1f; border: 1px solid var(--line); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 8px 0 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.field input { width: 100%; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 16px; font: 16px "Inter", sans-serif; outline: none; transition: border-color 200ms; }
.field input:focus { border-color: var(--accent); }
.err { color: #d33a5f; font-size: 12px; min-height: 18px; margin: 6px 2px; }
.skip { display: block; margin: 14px auto 0; color: var(--muted); font-size: 14px; font-weight: 500; }
.otp { position: relative; display: block; }
.otp input { position: absolute; inset: 0; opacity: 0; font-size: 16px; width: 100%; }
.boxes { display: flex; gap: 8px; }
.boxes span { flex: 1; height: 58px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 22px; font-weight: 700; transition: border-color 200ms; }
.boxes span.on { border-color: var(--accent); }
.link { color: var(--accent); font-weight: 600; font-size: 14px; }

/* Home */
.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.hero { position: relative; height: 190px; border-radius: 24px; overflow: hidden; margin-bottom: 18px; background: #3a1426; color: #fff; }
.hero img { position: absolute; right: -10px; top: 0; height: 100%; width: 58%; object-fit: cover; object-position: 50% 15%; animation: kb 9s ease-in-out infinite alternate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, #3a1426 38%, rgba(58,20,38,.0) 75%); }
.hero .txt { position: relative; z-index: 2; padding: 20px; max-width: 62%; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
.hero h3 { margin-top: 12px; font-size: 24px; line-height: 1.08; font-weight: 600; }
.hero .cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 9px 14px; border-radius: 999px; background: #fff; color: #2e1220; font-size: 13px; font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; }
.chip { flex: none; padding: 9px 15px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); color: var(--muted); transition: all 200ms; }
.chip.on { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.chip small { opacity: .7; margin-left: 4px; }
.masonry { columns: 2; column-gap: 12px; }
.pin { break-inside: avoid; margin-bottom: 14px; cursor: pointer; animation: rise 400ms both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.pin .ph { position: relative; border-radius: 18px; overflow: hidden; background: var(--surface-2); }
.pin img, .pin video { display: block; width: 100%; height: auto; transition: transform 400ms; }
.pin:active img, .pin:active video { transform: scale(1.04); }
.vtag { position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; }
.heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.8); color: #2e1220; z-index: 2; }
.heart svg { width: 16px; height: 16px; }
.heart.on { color: #d6336c; }
.heart.on svg path { fill: currentColor; }
.meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tabbar { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 64px; border-radius: 32px; display: flex; justify-content: space-around; align-items: center; background: var(--tabbar); backdrop-filter: blur(16px); border: 1px solid var(--line); z-index: 5; }
.tabbar button { color: var(--muted); display: grid; place-items: center; width: 44px; height: 44px; }
.tabbar button.on { color: var(--text); }
.tabbar svg { width: 22px; height: 22px; }

/* Product */
.media { position: relative; height: 430px; border-radius: 28px; overflow: hidden; margin-bottom: 18px; background: var(--surface-2); }
.media img, .media video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.media.video img { animation: kb 7s ease-in-out infinite alternate; }
.media.video::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.28) 50%, transparent 62%); background-size: 260% 100%; animation: sweep 3.5s ease-in-out infinite; pointer-events: none; }
@keyframes kb { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.16) translate(-2.5%, -3%); } }
@keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
.vbar { position: absolute; left: 16px; right: 16px; bottom: 64px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.4); overflow: hidden; z-index: 2; }
.vbar i { display: block; height: 100%; background: #fff; animation: prog 7s linear infinite; }
@keyframes prog { from { width: 0; } to { width: 100%; } }
.live { position: absolute; top: 14px; left: 14px; font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; z-index: 3; letter-spacing: .04em; }
.live i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: #ff4d6d; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.m-tabs { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.8); backdrop-filter: blur(10px); z-index: 3; }
.m-tabs button { padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #2e1220; white-space: nowrap; }
.m-tabs button.on { background: #3a1426; color: #fff; }
.p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.p-name { font-size: 28px; font-weight: 600; line-height: 1.1; }
.p-price { font-size: 19px; font-weight: 700; white-space: nowrap; }
.rating { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
.rating b { color: #e3a33b; letter-spacing: 1px; }
.p-desc { margin: 10px 0 4px; color: var(--muted); font-size: 14px; line-height: 1.55; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-btn { padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; transition: all 200ms; text-align: left; }
.opt-btn small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 2px; }
.opt-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: left; margin-top: 4px; }
.toggle .grow { flex: 1; font-weight: 600; font-size: 14px; }
.toggle .grow small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 2px; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background 200ms; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 200ms; }
.toggle.on .switch { background: var(--accent); }
.toggle.on .switch::after { transform: translateX(18px); }

.cta-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px 34px; display: flex; gap: 12px; align-items: center; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
.qty { display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 14px; border-radius: 27px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.qty button { width: 24px; height: 24px; font-size: 18px; color: var(--muted); }
.btn-main { flex: 1; height: 54px; border-radius: 27px; background: var(--btn-bg); color: var(--btn-fg); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 150ms; }
.btn-main:active { transform: scale(.97); }
.btn-main.pink { background: var(--accent); color: var(--accent-fg); }
.full { width: 100%; flex: none; }
.btn-ghost { width: 100%; height: 50px; border-radius: 25px; border: 1px solid var(--line); margin-top: 10px; font-weight: 600; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(127,127,127,.3); border-top-color: currentColor; animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Bag / checkout */
.row { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; }
.thumb { width: 66px; height: 84px; flex: none; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
.row .info { flex: 1; min-width: 0; }
.row .info b { display: block; font-size: 15px; }
.row .info span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .qty { height: 36px; padding: 0 10px; gap: 10px; font-size: 14px; }
.summary { margin-top: 16px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.summary div { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); }
.summary .total { color: var(--text); font-weight: 700; font-size: 17px; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 12px; }
.empty { text-align: center; padding-top: 120px; color: var(--muted); }
.card-box { padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; font-size: 14px; }
.card-box .lbl { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; width: 100%; text-align: left; transition: border-color 200ms; }
.opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; }
.opt.on { border-color: var(--accent); }
.opt.on .radio { border-color: var(--accent); }
.opt.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.opt .grow { flex: 1; }
.opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.secure { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 4px; }

/* ---------------- Track order ---------------- */
.order-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
.stack { display: flex; flex: none; }
.stack .thumb { width: 46px; height: 58px; border-radius: 12px; border: 2px solid var(--surface); }
.stack .thumb + .thumb { margin-left: -14px; }
.order-card .info { flex: 1; min-width: 0; }
.order-card b { display: block; font-size: 15px; }
.order-card span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.status { flex: none; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.status.done { background: #dff3e4; color: #1f7a3d; }
.map-wrap { position: relative; border-radius: 24px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 16px; }
.map { display: block; width: 100%; height: auto; }
.eta { position: absolute; left: 12px; top: 12px; padding: 8px 12px; border-radius: 14px; background: var(--surface); box-shadow: 0 6px 20px rgba(46,18,32,.12); font-size: 12px; color: var(--muted); }
.eta b { display: block; font-size: 16px; color: var(--text); }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .6; } to { transform: scale(2.4); opacity: 0; } }
.steps { list-style: none; padding: 4px 4px 0; }
.steps li { position: relative; display: flex; gap: 14px; padding-bottom: 20px; }
.steps li::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps li.done::before { background: var(--accent); }
.steps .dot2 { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--line); color: #fff; transition: all 300ms; }
.steps .dot2 svg { width: 14px; height: 14px; opacity: 0; }
.steps li.done .dot2 { background: var(--accent); border-color: var(--accent); }
.steps li.done .dot2 svg { opacity: 1; }
.steps li.now .dot2 { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.steps b { display: block; font-size: 15px; font-weight: 600; }
.steps span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.steps li:not(.done):not(.now) b { color: var(--muted); font-weight: 500; }
.rider { position: absolute; left: 14px; right: 14px; bottom: 26px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 24px; background: #3a1426; color: #fff; box-shadow: 0 16px 40px rgba(58,20,38,.35); }

function loadFlutterwave() {
    return window.FlutterwaveCheckout ? Promise.resolve() : new Promise((ok, fail) => {
        const s = document.createElement("script");
        s.src = "https://checkout.flutterwave.com/v3.js"; s.onload = ok; s.onerror = fail;
        document.head.appendChild(s);
    });
}
async function payWithFlutterwave() {
    const t = totals(), txRef = "CH-" + Date.now();
    try { await loadFlutterwave(); } catch (e) { toast("Couldn't open payment. Check your connection."); render("checkout"); return; }
    const modal = FlutterwaveCheckout({

        payment_options: { card: "card", transfer: "banktransfer", ussd: "ussd" }[state.pay],

        callback: (res) => {
            modal.close();
            if (res.status === "successful" || res.status === "completed") {
                toast("Payment received 🎉", "check");
                placeOrder({ txRef, transactionId: res.transaction_id });
            } else { toast("Payment was not completed"); render("checkout"); }

        onclose: (incomplete) => { if (incomplete) render("checkout"); },

}

}

// ---------- Live tracking ----------
// Prototype timing (compressed): packed → out for delivery → rider rides to you → delivered
const PHASE = params.has("demo") ? { pack: 2500, out: 5000, ride: 15000, drop: 2200 } : { pack: 5000, out: 10000, ride: 45000, drop: 3000 };
const ROUTE_KM = 4.2, ROUTE_MIN = 18;
let trackStage = -1, routeEl, doneEl, riderEl, routeLen;

function saveTracking() {
    if (params.has("demo")) return;
    try { localStorage.setItem("camorraHair.track", JSON.stringify(state.tracking)); } catch (e) {}
}
function clearTracking() {
    try { localStorage.removeItem("camorraHair.track"); } catch (e) {}
    state.tracking = null;
}

function stepsHTML(stage, tr) {
    const t0 = tr.start, min = 60000;
    const rows = [
        ["Order confirmed", clock(t0)],
        ["Unit styled & packed", stage >= 1 ? clock(t0 + 13 * min) : "Your stylist is on it"],
        ["Out for delivery", stage >= 2 ? (stage >= 3 ? "Rider has arrived" : `<span id="tr-away">Rider is on the way</span>`) : "Waiting for pickup"],
        ["Delivered", stage >= 4 ? clock(t0 + 58 * min) : tr.express ? "Today, 3 – 6 PM" : "Tomorrow"],
    ];
    const done = [true, stage >= 1, stage >= 3, stage >= 4];
    return rows.map(([b, s], i) => `<li class="${done[i] ? "done" : (i === stage + 1 || (i === 2 && stage === 2)) ? "now" : ""}"><span class="dot2">${I.check}</span><div><b>${b}</b><span>${s}</span></div></li>`).join("");
}
function riderHTML(stage) {
    if (stage >= 4) return `<div class="av">✓</div><div class="info"><b>Delivered — enjoy your unit!</b><span>Tunde A. · ★ 4.9 · Lagos Express</span></div><button class="btn-main" data-action="done">Back to shop</button>`;
    return `<div class="av">TA</div><div class="info"><b>Tunde A. · Your rider</b><span>★ 4.9 · Lagos Express</span></div><button class="call" data-action="call" aria-label="Call rider">${I.phone}</button>`;
}

function trackTick() {
    const tr = state.tracking;
    if (!tr || !$("#track").classList.contains("active")) { trackStage = -1; return; }
    const t = Date.now() - tr.start;
    const stage = t < PHASE.pack ? 0 : t < PHASE.out ? 1 : t < PHASE.out + PHASE.ride ? 2 : t < PHASE.out + PHASE.ride + PHASE.drop ? 3 : 4;
    if (stage !== trackStage) {
        if (trackStage === 2 && stage === 3) toast("Tunde has arrived 🎉", "check");
        trackStage = stage;
        $("#tr-steps").innerHTML = stepsHTML(stage, tr);
        $("#tr-rider").innerHTML = riderHTML(stage);
        const st = $("#tr-status");
        st.textContent = ["Confirmed", "Packed", "On the way", "Arrived", "Delivered"][stage];
        st.classList.toggle("done", stage >= 3);
        routeEl = $("#track .map path[stroke-dasharray]"); doneEl = $("#route-done"); riderEl = $("#rider-dot");
        routeLen = routeEl.getTotalLength();
        doneEl.style.strokeDasharray = routeLen;
    }
    // rider position along the route (eases in and out like real traffic)
    const raw = Math.min(1, Math.max(0, (t - PHASE.out) / PHASE.ride));
    const p = raw < .5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
    const pt = routeEl.getPointAtLength(routeLen * p);
    riderEl.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
    doneEl.style.strokeDashoffset = routeLen * (1 - p);
    const km = ROUTE_KM * (1 - p), mins = Math.max(1, Math.ceil(ROUTE_MIN * (1 - p)));
    const eta = $("#tr-eta");
    if (stage === 0) eta.innerHTML = `<b>Preparing</b>Your unit is being styled`;
    else if (stage === 1) eta.innerHTML = `<b>Packed ✓</b>Rider picking up soon`;
    else if (stage === 2) eta.innerHTML = `<b>${mins} min away</b>${km.toFixed(1)} km · Tunde is riding to you`;
    else if (stage === 3) eta.innerHTML = `<b>Arrived 🎉</b>Tunde is at your door`;
    else eta.innerHTML = `<b>Delivered</b>Thank you for shopping with us`;
    const away = $("#tr-away");
    if (away) away.textContent = `Rider is ${mins} min${mins > 1 ? "s" : ""} away`;
    requestAnimationFrame(trackTick);
}

// ---------- Navigation ----------
let stack = ["login"];
function render(name) { $("#" + name).innerHTML = R[name](); }
function go(name) {
    render(name);
    const cur = $("#" + stack[stack.length - 1]), next = $("#" + name);
    next.classList.remove("prev");
    const sc = next.querySelector(".scroll"); if (sc) sc.scrollTop = 0;
    requestAnimationFrame(() => { cur.classList.remove("active"); cur.classList.add("prev"); next.classList.add("active"); });
    stack.push(name);
}
function back() {
    if (stack.length < 2) return;
    const cur = $("#" + stack.pop()), prev = $("#" + stack[stack.length - 1]);
    render(prev.id);
    cur.classList.remove("active"); prev.classList.remove("prev"); prev.classList.add("active");
}
function goRoot(name) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active", "prev"));
    stack = [name];
    render(name);
    $("#" + name).classList.add("active");
    if (name === "track") { trackStage = -1; requestAnimationFrame(trackTick); }
}

const nameFrom = (email) => { const n = email.split("@")[0].split(/[._\-+0-9]/)[0] || "gorgeous"; return n[0].toUpperCase() + n.slice(1).toLowerCase(); };

// ---------- Taps ----------
app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const { action, id } = el.dataset;
    if (action === "open") { state.product = id; state.opts = defaultOpts(wig(id)); state.qty = 1; go("product"); }
    if (action === "go") go(el.dataset.to);
    if (action === "back") back();
    if (action === "filter") { state.filter = el.dataset.f; render("home"); }
    if (action === "like") { state.liked.has(id) ? state.liked.delete(id) : state.liked.add(id); el.classList.toggle("on"); }
    if (action === "opt") {
        const k = el.dataset.opt;
        if (k === "install") state.opts.install = !state.opts.install; else state.opts[k] = +el.dataset.v;
        const sc = $("#product .scroll").scrollTop; render("product"); $("#product .scroll").scrollTop = sc;
    }
    if (action === "qty") { state.qty = Math.max(1, state.qty + +el.dataset.d); const sc = $("#product .scroll").scrollTop; render("product"); $("#product .scroll").scrollTop = sc; }
    if (action === "add") {
        const w = wig(state.product);
        state.bag.push({ id: w.id, opts: { ...state.opts }, qty: state.qty, price: unitPrice(w, state.opts) });
        updateBadge(true); toast(`${w.name} added to bag`);
    }
    if (action === "bagqty") {
        const item = state.bag[+el.dataset.i];
        item.qty += +el.dataset.d;
        if (item.qty <= 0) state.bag.splice(+el.dataset.i, 1);
        render("bag"); updateBadge();
    }
    if (action === "ship") { state.express = el.dataset.x === "1"; render("checkout"); }
    if (action === "pay-m") { state.pay = el.dataset.m; render("checkout"); }
    if (action === "pay") {
        const c = state.contact;
        if (!c.name.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) {
            $("#co-err").textContent = "Add your name and a valid email for your receipt";
            $("#checkout .scroll").scrollTop = 0; return;
        }
        el.innerHTML = spinner(FLUTTERWAVE.publicKey && !params.has("demo") ? "Opening secure payment…" : "Confirming payment…");
        if (FLUTTERWAVE.publicKey && !params.has("demo")) payWithFlutterwave();
        else setTimeout(() => { toast("Order confirmed 🎉", "check"); placeOrder(); }, 1500);   // demo / no key yet
    }
    if (action === "call") toast("Calling Tunde…", "phone");
    if (action === "done") { clearTracking(); goRoot("home"); }
    if (action === "auth") {
        const p = el.dataset.p;
        el.innerHTML = spinner("Signing in…");
        setTimeout(() => signIn({ name: "Bella", email: p === "Apple" ? "bella@icloud.com" : "bella@gmail.com", via: p }), 1100);
    }
    if (action === "email") {
        const v = $("#email").value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { $("#email-err").textContent = "Enter a valid email address"; return; }
        state.pendingEmail = v; go("code");
        setTimeout(() => $("#otp") && $("#otp").focus({ preventScroll: true }), 500);
    }
    if (action === "verify") {
        const c = $("#otp").value;
        if (c.length < 6) { $("#otp-err").textContent = "Enter the 6-digit code"; return; }
        el.innerHTML = spinner("Verifying…");
        setTimeout(() => signIn({ name: nameFrom(state.pendingEmail), email: state.pendingEmail, via: "email" }), 900);
    }
    if (action === "resend") toast("New code sent", "mail");
    if (action === "guest") signIn({ name: "gorgeous", guest: true });
});

(function codeView() {

    const part = src.slice(src.indexOf("// <code-view>") + 15, src.indexOf("// </code-view>")).trimEnd();
    const e = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    $("#code-view").innerHTML = part.split("\n").map((line) => `<span class="l">${e(line).replace(re, (m, c, s, k, n) =>
        c ? `<span class="tk-c">${m}</span>` : s ? `<span class="tk-s">${m}</span>` : k ? `<span class="tk-k">${m}</span>` : n ? `<span class="tk-n">${m}</span>` : `<span class="tk-p">${m}</span>`)}</span>`).join("");
})();

// ---------- Auto demo (for screen recording) ----------
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
async function tap(sel) {
    const el = typeof sel === "string" ? $(".screen.active " + sel) : sel;
    if (!el) { console.warn("demo: missing", sel); return; }
    const sc = el.closest(".scroll");
    if (sc) {
        const r = el.getBoundingClientRect(), a = sc.getBoundingClientRect();
        if (r.bottom > a.bottom - 120 || r.top < a.top + 60) { sc.scrollBy({ top: r.top - a.top - sc.clientHeight / 3, behavior: "smooth" }); await wait(750); }
    }
    const r = el.getBoundingClientRect(), a = app.getBoundingClientRect(), k = a.width / app.offsetWidth;
    const dot = document.createElement("div");
    dot.className = "tap";
    dot.style.left = (r.left + r.width / 2 - a.left) / k + "px";
    dot.style.top = (r.top + r.height / 2 - a.top) / k + "px";
    app.appendChild(dot); setTimeout(() => dot.remove(), 700);
    await wait(220);
    el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
}
async function scrollActive(px) { $(".screen.active .scroll").scrollBy({ top: px, behavior: "smooth" }); await wait(1000); }

if (params.has("demo")) setTimeout(demo, 300);
