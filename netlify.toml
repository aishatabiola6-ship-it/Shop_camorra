# Netlify settings for Preshy Emporium (plain static site + serverless functions, no build step)
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Ship the price list and store settings with the functions, so they can read them from disk.
  included_files = ["config.js", "products.js"]
