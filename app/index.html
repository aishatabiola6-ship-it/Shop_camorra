<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff4f7">
<title>Camorra App</title>
<meta name="description" content="Clickable Shop Camorra lip gloss shopping app prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --s: 1; }
/* Default theme: blush pink */
body {
    --bg: #fff4f7;
    --surface: #ffffff;
    --surface-2: #fde8ef;
    --line: #f4d5e0;
    --text: #3a1426;
    --muted: #9a7080;
    --accent: #e0457f;
    --accent-fg: #ffffff;
    --btn-bg: #3a1426;
    --btn-fg: #fff4f7;
    --tabbar: rgba(255, 255, 255, .85);
    --indicator: rgba(58, 20, 38, .8);
    --splash: radial-gradient(circle at 50% 45%, #ffc9dc 0%, #fff4f7 70%);
    --stage: radial-gradient(ellipse at 30% 20%, #ffe1ec 0%, #f3bfd2 100%);
}
/* ?dark — the original black theme */
body.dark {
    --bg: #0e0d10;
    --surface: #19171c;
    --surface-2: #232026;
    --line: #2c2930;
    --text: #f6efe9;
    --muted: #9b939e;
    --accent: #f478a8;
    --accent-fg: #2a0b18;
    --btn-bg: #f6efe9;
    --btn-fg: #111111;
    --tabbar: rgba(30, 28, 33, .85);
    --indicator: rgba(255, 255, 255, .85);
    --splash: radial-gradient(circle at 50% 45%, #3a1a2a 0%, #0e0d10 65%);
    --stage: radial-gradient(ellipse at 30% 20%, #221a22 0%, #0a090b 60%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--stage) fixed;
    color: var(--text);
    overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ---------------- Stage: phone + code ---------------- */
.stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 20px;
}
.device-slot { flex: none; position: relative; }
.device {
    position: absolute;
    left: 0; top: 0;
    width: 414px;
    height: 868px;
    border-radius: 64px;
    padding: 12px;
    background: #1b1a1d;
    box-shadow: 0 0 0 2px #3a383d, 0 40px 120px rgba(0,0,0,.6), inset 0 0 0 2px #000;
    transform: scale(var(--s));
    transform-origin: 0 0;
}
.island {
    position: absolute;
    top: 24px; left: 50%;
    width: 120px; height: 34px;
    transform: translateX(-50%);
    background: #000;
    border-radius: 20px;
    z-index: 60;
}
.app {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 52px;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
}
.statusbar {
    position: absolute; inset: 0 0 auto 0;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 34px 0 40px;
    font-size: 15px; font-weight: 600;
    z-index: 50;
    pointer-events: none;
}
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.home-indicator {
    position: absolute; bottom: 8px; left: 50%;
    width: 134px; height: 5px; border-radius: 3px;
    background: var(--indicator);
    transform: translateX(-50%);
    z-index: 50; pointer-events: none;
}

/* ---------------- Code panel ---------------- */
.editor {
    width: 540px;
    max-height: calc(100vh - 80px);
    background: #141317;
    border: 1px solid #2a282d;
    border-radius: 14px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.editor-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #2a282d; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.tab { margin-left: 14px; font: 500 12px "JetBrains Mono", monospace; color: #cfc7d2; background: #1d1b20; padding: 6px 12px; border-radius: 6px; }
.code {
    flex: 1; overflow: hidden;
    font: 12.5px/1.65 "JetBrains Mono", monospace;
    color: #d8d2db;
    padding: 14px 0;
    counter-reset: ln;
}
.code .l { display: block; white-space: pre; padding-right: 16px; }
.code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 44px; padding-right: 16px; text-align: right; color: #55505a; }
.tk-k { color: #ff7ab2; } .tk-s { color: #f6c177; } .tk-n { color: #9ccfd8; } .tk-c { color: #6e6a76; font-style: italic; } .tk-p { color: #c4a7e7; }
@media (max-width: 1100px) { .editor { display: none; } }

/* Play demo button (outside the phone) */
.play {
    position: fixed; left: 20px; bottom: 20px;
    padding: 10px 16px; border-radius: 999px;
    background: #fff; color: #111; font-weight: 600; font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    z-index: 100;
}
body.demo .play { display: none; }

/* ---------------- Screens ---------------- */
.screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform 450ms cubic-bezier(.2,.8,.2,1), opacity 450ms;
    z-index: 1;
}
.screen.active { transform: none; z-index: 3; }
.screen.prev { transform: translateX(-25%); opacity: .5; z-index: 2; }
.scroll { flex: 1; overflow-y: auto; padding: 60px 18px 130px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.icon-btn {
    position: relative;
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
}
.icon-btn svg { width: 20px; height: 20px; }
.badge {
    position: absolute; top: -3px; right: -3px;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--accent); color: var(--accent-fg);
    font-size: 11px; font-weight: 700; display: grid; place-items: center;
    transition: transform 200ms;
}
.badge:empty { display: none; }
.badge.bump { transform: scale(1.4); }
.title-sm { font-size: 13px; color: var(--muted); }
.title-lg { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.h-screen { font-size: 17px; font-weight: 600; }

/* Splash */
.splash {
    position: absolute; inset: 0; z-index: 40;
    display: grid; place-items: center; text-align: center;
    background: var(--splash);
    transition: opacity 600ms, visibility 600ms;
}
.splash.hide { opacity: 0; visibility: hidden; }
.logo { font-size: 46px; font-weight: 900; letter-spacing: -0.06em; }
.logo i { display: inline-block; width: 12px; height: 16px; margin-left: 2px; background: var(--accent); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: drip 1.6s ease-in-out infinite; }
@keyframes drip { 50% { transform: translateY(6px) scaleY(1.15); } }
.splash p { margin-top: 8px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

/* Home */
.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.hero {
    position: relative; height: 168px; border-radius: 24px; overflow: hidden;
    padding: 20px;
    background: linear-gradient(135deg, #f478a8 0%, #a86a86 55%, #5a2140 100%);
    margin-bottom: 20px;
}
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.22); backdrop-filter: blur(6px); }
.hero h3 { margin-top: 12px; font-size: 24px; line-height: 1.05; letter-spacing: -0.03em; max-width: 170px; }
.hero .go { position: absolute; left: 20px; bottom: 18px; width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; }
.hero .tubes { position: absolute; right: 8px; top: 8px; bottom: -40px; width: 170px; }
.hero .tubes > div { position: absolute; height: 170px; }
.hero .tubes > div svg { height: 100%; width: auto; filter: drop-shadow(0 12px 18px rgba(0,0,0,.3)); }

.chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; }
.chip { flex: none; padding: 9px 15px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); color: var(--muted); transition: all 200ms; }
.chip.on { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { position: relative; cursor: pointer; animation: rise 400ms both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.tile { position: relative; height: 190px; border-radius: 20px; display: grid; place-items: center; overflow: hidden; }
.tile .t { height: 80%; transform: rotate(-16deg); transition: transform 300ms; }
.tile .t svg { height: 100%; width: auto; filter: drop-shadow(0 14px 18px rgba(0,0,0,.18)); }
.card:active .tile .t { transform: rotate(-10deg) scale(.96); }
.heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.7); color: #2b1a22; z-index: 2; }
.heart svg { width: 16px; height: 16px; }
.heart.on { color: #e0356f; }
.heart.on svg path { fill: currentColor; }
.meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.tabbar {
    position: absolute; left: 14px; right: 14px; bottom: 26px;
    height: 64px; border-radius: 32px;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--tabbar); backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    z-index: 5;
}
.tabbar span { color: var(--muted); display: grid; place-items: center; }
.tabbar span.on { color: var(--text); }
.tabbar svg { width: 22px; height: 22px; }

/* Product */
.p-tile { position: relative; height: 340px; border-radius: 28px; display: grid; place-items: center; overflow: hidden; margin-bottom: 20px; transition: background-color 400ms; }
.p-tile .glow { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,.45); filter: blur(10px); }
.p-tile .t { position: relative; height: 82%; transform: rotate(-14deg); animation: floaty 4s ease-in-out infinite; }
.p-tile .t svg { height: 100%; width: auto; filter: drop-shadow(0 24px 30px rgba(0,0,0,.22)); }
@keyframes floaty { 50% { transform: rotate(-10deg) translateY(-8px); } }
.p-head { display: flex; justify-content: space-between; align-items: baseline; }
.p-name { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; }
.p-price { font-size: 20px; font-weight: 700; }
.p-desc { margin: 10px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
.swatches { display: flex; gap: 10px; margin-bottom: 20px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; padding: 3px; transition: border-color 200ms; }
.sw i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 -6px 10px rgba(0,0,0,.15), inset 0 4px 8px rgba(255,255,255,.5); }
.sw.on { border-color: var(--text); }
.rating { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
.rating b { color: #f6c177; letter-spacing: 1px; }

.cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 18px 34px;
    display: flex; gap: 12px; align-items: center;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    z-index: 5;
}
.qty { display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 14px; border-radius: 27px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.qty button { width: 24px; height: 24px; font-size: 18px; color: var(--muted); }
.btn-main {
    flex: 1; height: 54px; border-radius: 27px;
    background: var(--btn-bg); color: var(--btn-fg);
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 150ms;
}
.btn-main:active { transform: scale(.97); }
.btn-main.pink { background: var(--accent); color: var(--accent-fg); }

/* Bag / checkout */
.row { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; }
.thumb { width: 72px; height: 80px; flex: none; border-radius: 14px; display: grid; place-items: center; overflow: hidden; }
.thumb .t { height: 78%; transform: rotate(-14deg); }
.thumb .t svg { height: 100%; width: auto; }
.row .info { flex: 1; }
.row .info b { display: block; font-size: 15px; }
.row .info span { font-size: 12px; color: var(--muted); }
.row .qty { height: 36px; padding: 0 10px; gap: 10px; font-size: 14px; }
.summary { margin-top: 16px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.summary div { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); }
.summary .total { color: var(--text); font-weight: 700; font-size: 17px; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 12px; }
.promo { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 16px; border: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.promo b { color: var(--accent); }
.empty { text-align: center; padding-top: 120px; color: var(--muted); }

.card-box { padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; font-size: 14px; }
.card-box .lbl { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; width: 100%; text-align: left; transition: border-color 200ms; }
.opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.opt.on { border-color: var(--accent); }
.opt.on .radio { border-color: var(--accent); }
.opt.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.opt .grow { flex: 1; }
.opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.paycard {
    height: 150px; border-radius: 20px; padding: 18px; margin-bottom: 12px;
    background: linear-gradient(135deg, #2a1a24, #5a2140 60%, #a86a86);
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
}
.paycard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
.paycard .num { font: 500 17px "JetBrains Mono", monospace; letter-spacing: 2px; }
.paycard .bottom { display: flex; justify-content: space-between; font-size: 12px; opacity: .8; }
.mini-thumbs { display: flex; gap: 8px; }
.mini-thumbs .thumb { width: 52px; height: 58px; border-radius: 12px; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(127,127,127,.3); border-top-color: var(--accent-fg); animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Success */
.success { text-align: center; padding-top: 30px; }
.check { width: 96px; height: 96px; margin: 0 auto 18px; }
.check circle { stroke-dasharray: 280; stroke-dashoffset: 280; animation: draw 700ms ease forwards; }
.check path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 400ms 500ms ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.success h2 { font-size: 28px; letter-spacing: -0.03em; }
.success p { color: var(--muted); font-size: 14px; margin-top: 6px; }
.order-card { text-align: left; margin-top: 26px; padding: 18px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.order-card .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.track { display: flex; gap: 6px; margin-top: 16px; }
.track i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.track i.on { background: var(--accent); }
.track-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 8px; }
.btn-ghost { width: 100%; height: 50px; border-radius: 25px; border: 1px solid var(--line); margin-top: 10px; font-weight: 600; }

/* Toast + demo tap */
.toast {
    position: absolute; left: 50%; top: 64px; z-index: 45;
    transform: translate(-50%, -30px); opacity: 0;
    padding: 10px 16px; border-radius: 999px;
    background: var(--btn-bg); color: var(--btn-fg); font-size: 13px; font-weight: 600;
    display: flex; gap: 8px; align-items: center;
    white-space: nowrap;
    transition: all 300ms;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.tap {
    position: absolute; z-index: 55; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8);
    pointer-events: none; animation: tap 600ms ease forwards;
}
@keyframes tap { 0% { transform: scale(.4); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

/* ---------------- Real phone: go fullscreen, no frame ---------------- */
@media (max-width: 500px) {
    .stage { padding: 0; }
    .device-slot { width: 100vw !important; height: 100dvh !important; }
    .device { position: static; width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; transform: none; background: var(--bg); }
    .island, .statusbar, .home-indicator, .play { display: none; }
    .app { border-radius: 0; }
    .scroll { padding-top: calc(env(safe-area-inset-top) + 16px); }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>

<div class="stage">
    <div class="device-slot">
        <div class="device">
            <div class="island"></div>

                    <span>9:41</span>
                    <span class="icons">
                        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.2A10.3 10.3 0 0 0 8 .8 10.3 10.3 0 0 0 .8 3.7L2 4.9a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A7 7 0 0 0 8 4.2a7 7 0 0 0-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c.5 0 1 .2 1.3.5L8 11 6.7 9.7c.3-.3.8-.5 1.3-.5Z"/></svg>

                    </span>
                </div>

                <div class="splash" id="splash">
                    <div><div class="logo">camorra<i></i></div><p>Lip gloss studio</p></div>

</div>

<button class="play" id="play" type="button">▶ Play demo</button>

<script id="app-js">
// <code-view>
// Camorra — lip gloss shopping app
const SHADES = [
    { id: "cristallo", name: "Cristallo", note: "Clear",      tag: "Clear",  price: 12,
      tile: "#e9edf5", swatch: "#efe9f2", pkg: { type: "dome", body: "#e9e4ec", label: "#8a90a6" },
      desc: "Crystal-clear, mirror-shine gloss. Wear it alone for glass lips or layer it over any shade." },
    { id: "fragola",   name: "Fragola",   note: "Strawberry", tag: "Glossy", price: 14,

const state = { product: "fragola", qty: 1, bag: [], liked: new Set(["lampone"]), filter: "All", express: false };

function addToBag(id, qty) {
    const item = state.bag.find((i) => i.id === id);
    item ? (item.qty += qty) : state.bag.push({ id, qty });
    updateBadge(true);
    toast(`${shade(id).name} added to bag`);

function totals() {
    const sub = state.bag.reduce((s, i) => s + shade(i.id).price * i.qty, 0);
    const delivery = state.express ? 4.99 : sub >= 30 ? 0 : 3.5;
    return { sub, delivery, total: sub + delivery };
}

let gid = 0;
function tube(p) {
    const id = "g" + gid++;
    const S = `url(#s${id})`, C = `url(#c${id})`;
    const defs = `<defs><linearGradient id="s${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".55"/><stop offset=".42" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient><linearGradient id="c${id}" x1="0" x2="1"><stop offset="0" stop-color="#8a8a8e"/><stop offset=".2" stop-color="#f7f7f9"/><stop offset=".45" stop-color="#b9b9be"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#76767b"/></linearGradient></defs>`;

    if (p.type === "squeeze") {

    } else if (p.type === "frosted") {
        b = `<rect x="24" y="4" width="72" height="150" rx="12" fill="${p.cap}"/><rect x="24" y="4" width="72" height="150" rx="12" fill="${S}"/><rect x="16" y="150" width="88" height="262" rx="18" fill="${p.body}"/><rect x="16" y="150" width="88" height="262" rx="18" fill="#fff" opacity=".18"/><rect x="16" y="150" width="88" height="262" rx="18" fill="${S}"/>${label(282)}`;
    } else {
        b = `<path d="M26 150 V60 A34 34 0 0 1 94 60 V150 Z" fill="${C}"/><rect x="20" y="148" width="80" height="22" rx="4" fill="${C}"/><path d="M18 170 H102 V360 A42 42 0 0 1 18 360 Z" fill="#fff" opacity=".6"/><path d="M28 178 H92 V356 A32 32 0 0 1 28 356 Z" fill="${p.body}"/><path d="M18 170 H102 V360 A42 42 0 0 1 18 360 Z" fill="${S}"/>${label(290)}`;
    }
    return `<svg viewBox="0 0 120 420" xmlns="http://www.w3.org/2000/svg">${defs}${b}</svg>`;
}

// ---------- Navigation ----------
let stack = ["home"];
function render(name) { $("#" + name).innerHTML = R[name](); }

function go(name) {
    render(name);
    const cur = $("#" + stack[stack.length - 1]);
    const next = $("#" + name);
    next.classList.remove("prev");
    next.querySelector(".scroll").scrollTop = 0;
    requestAnimationFrame(() => {
        cur.classList.remove("active"); cur.classList.add("prev");
        next.classList.add("active");
    });
    stack.push(name);
}
function back() {
    if (stack.length < 2) return;
    const cur = $("#" + stack.pop());
    const prev = $("#" + stack[stack.length - 1]);
    render(prev.id);
    cur.classList.remove("active");
    prev.classList.remove("prev"); prev.classList.add("active");
}
function goHome() {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active", "prev"));
    stack = ["home"];
    render("home");
    $("#home").classList.add("active");
}

function updateBadge(bump) {
    document.querySelectorAll(".badge").forEach((b) => {
        b.textContent = bagCount();
        if (bump) { b.classList.add("bump"); setTimeout(() => b.classList.remove("bump"), 200); }
    });
}
let toastTimer;
function toast(msg) {
    const t = $("#toast");
    t.innerHTML = `${I.bag.replace("<svg", '<svg width="16" height="16"')} ${msg}`;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

// ---------- Taps ----------
app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const { action, id } = el.dataset;
    if (action === "open") { state.product = id; state.qty = 1; go("product"); }
    if (action === "go") go(el.dataset.to);
    if (action === "back") back();
    if (action === "filter") { state.filter = el.dataset.f; render("home"); }
    if (action === "like") { state.liked.has(id) ? state.liked.delete(id) : state.liked.add(id); el.classList.toggle("on"); }
    if (action === "shade") { state.product = id; render("product"); }
    if (action === "qty") { state.qty = Math.max(1, state.qty + +el.dataset.d); render("product"); }
    if (action === "add") addToBag(state.product, state.qty);
    if (action === "bagqty") {
        const item = state.bag.find((i) => i.id === id);
        item.qty += +el.dataset.d;
        if (item.qty <= 0) state.bag = state.bag.filter((i) => i !== item);
        render("bag"); updateBadge();
    }
    if (action === "ship") { state.express = el.dataset.x === "1"; render("checkout"); }
    if (action === "pay") {
        el.innerHTML = `<span class="spin"></span> Processing…`;
        setTimeout(() => go("success"), 1400);
    }
    if (action === "restart") { state.bag = []; state.express = false; goHome(); }
});

// ---------- Fit the phone to the window ----------
function fit() {
    // ?big lets the phone grow past real size (for crisp video recording)
    const cap = new URLSearchParams(location.search).has("big") ? Infinity : 1;
    const s = Math.min(cap, (window.innerHeight - 40) / 868, (window.innerWidth - 40) / 414);
    document.documentElement.style.setProperty("--s", s);
    const slot = $(".device-slot");
    slot.style.width = 414 * s + "px";
    slot.style.height = 868 * s + "px";
}
window.addEventListener("resize", fit);
fit();

// ---------- Code panel: shows this app's real source ----------
(function codeView() {
    const src = $("#app-js").textContent;
    const part = src.slice(src.indexOf("// <code-view>") + 15, src.indexOf("// </code-view>")).trimEnd();
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`|'(?:[^'\\]|\\.)*')|\b(const|let|function|return|new|if|else)\b|\b(\d+(?:\.\d+)?)\b|\b(state|SHADES|shade|toast|updateBadge)\b/gm;
    $("#code").innerHTML = part.split("\n").map((line) =>
        `<span class="l">${esc(line).replace(re, (m, c, s, k, n, p) =>
            c ? `<span class="tk-c">${m}</span>` : s ? `<span class="tk-s">${m}</span>` : k ? `<span class="tk-k">${m}</span>` : n ? `<span class="tk-n">${m}</span>` : `<span class="tk-p">${m}</span>`)}</span>`).join("");
})();

// ---------- Start ----------
if (new URLSearchParams(location.search).has("dark")) document.body.classList.add("dark");
render("home");
setTimeout(() => $("#splash").classList.add("hide"), 1600);

// ---------- Auto demo (for screen recording) ----------
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function tap(sel) {
    const el = typeof sel === "string" ? $(".screen.active " + sel) || $(sel) : sel;
    if (!el) return;
    const sc = el.closest(".scroll");
    if (sc) {
        const r = el.getBoundingClientRect(), a = sc.getBoundingClientRect();
        if (r.bottom > a.bottom - 120 || r.top < a.top + 60) {
            sc.scrollBy({ top: r.top - a.top - sc.clientHeight / 3, behavior: "smooth" });
            await wait(700);
        }
    }
    const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
    const k = a.width / app.offsetWidth;
    const dot = document.createElement("div");
    dot.className = "tap";
    dot.style.left = (r.left + r.width / 2 - a.left) / k + "px";
    dot.style.top = (r.top + r.height / 2 - a.top) / k + "px";
    app.appendChild(dot);
    setTimeout(() => dot.remove(), 700);
    await wait(220);
    el.click();
}
async function scrollActive(px) {
    $(".screen.active .scroll").scrollBy({ top: px, behavior: "smooth" });
    await wait(900);
}

let demoRunning = false;
async function demo() {
    if (demoRunning) return;
    demoRunning = true;
    document.body.classList.add("demo");
    state.bag = []; state.express = false; state.filter = "All";
    goHome();
    $("#splash").classList.remove("hide");
    await wait(1800);
    $("#splash").classList.add("hide");
    await wait(1000);
    await scrollActive(300);
    await scrollActive(-300);
    await tap('[data-f="Nude"]'); await wait(900);
    await tap('[data-f="All"]'); await wait(900);
    await tap('.card[data-id="fragola"]'); await wait(1300);
    await tap('[data-action="shade"][data-id="malva"]'); await wait(1000);
    await tap('[data-action="shade"][data-id="lampone"]'); await wait(1000);
    await tap('[data-action="qty"][data-d="1"]'); await wait(600);
    await tap('[data-action="add"]'); await wait(1200);
    await tap('[data-action="shade"][data-id="cristallo"]'); await wait(900);
    await tap('[data-action="qty"][data-d="-1"]'); await wait(400);
    await tap('[data-action="add"]'); await wait(1200);
    await tap('[data-to="bag"]'); await wait(1500);
    await tap('[data-to="checkout"]'); await wait(1300);
    await tap('[data-action="ship"][data-x="1"]'); await wait(1000);
    await tap('[data-action="pay"]'); await wait(4000);
    // Opened with ?demo (recording): keep the Play button hidden
    if (!new URLSearchParams(location.search).has("demo")) document.body.classList.remove("demo");
    document.body.classList.add("demo-done");
    demoRunning = false;
}
$("#play").addEventListener("click", demo);
if (new URLSearchParams(location.search).has("demo")) setTimeout(demo, 300);
