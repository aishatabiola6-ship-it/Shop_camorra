<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unboxd: phones, laptops, audio, watches and cameras, delivered boxed with warranty.">
<meta name="theme-color" content="#f3f4f6">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Unboxd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a phone-width app column (centred on wide screens) with stacked screens — splash, welcome, log in, home, categories, spotlight, bag, account — and a floating pill tab bar. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #0f1115;
  --muted: #6b7280;
  --line: #e5e7eb;
  --soft: #eceef1;
  --accent: #1f5eff;
  --accent-ink: #ffffff;
  --ok: #16a34a;
  --danger: #dc2626;
  --outside: #dfe2e7;
  --sans: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(15,17,21,.04), 0 6px 20px rgba(15,17,21,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f12; --surface: #171a1f; --ink: #f1f3f5; --muted: #9aa1ac; --line: #262a31; --soft: #1e2228;
  --accent: #6b93ff; --accent-ink: #0a0f1f; --ok: #4ade80; --danger: #f87171; --outside: #060709; --shadow: none; color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #0d0f12; --surface: #171a1f; --ink: #f1f3f5; --muted: #9aa1ac; --line: #262a31; --soft: #1e2228;
  --accent: #6b93ff; --accent-ink: #0a0f1f; --ok: #4ade80; --danger: #f87171; --outside: #060709; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--outside); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { position: relative; max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
@media (min-width: 600px) { .app { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.08); } }
.scr { padding: 18px max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 22px; align-content: start; grid-template-columns: minmax(0, 1fr); min-width: 0; }
h1, h2, h3 { margin: 0; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.big { font-size: 2rem; line-height: 1.05; letter-spacing: -0.04em; margin-top: 4px; }
.muted { color: var(--muted); margin: 0; font-size: 14px; }
.hs { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px))); padding-inline: max(20px, env(safe-area-inset-left, 0px)); }
.hs::-webkit-scrollbar { display: none; }
.hs > * { scroll-snap-align: start; flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; transition: transform .12s ease, opacity .12s ease; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.blue { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.full { width: 100%; }
.btn.busy { opacity: .7; pointer-events: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }
.ic { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.ic.dark { background: var(--ink); color: var(--bg); }
.ic svg { width: 20px; height: 20px; }
.badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--bg); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-ic { display: flex; gap: 10px; }
.hello { font-size: 13.5px; color: var(--muted); }
.name { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; }
.head { display: flex; align-items: center; gap: 12px; }
.head h1 { font-size: 1.4rem; flex: 1; min-width: 0; }
.head .count { font-size: 13px; color: var(--muted); }

/* Search */
.search { display: flex; gap: 10px; }
.search label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.search label svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14.5px; }
.search input::placeholder { color: var(--muted); }
.filt { width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.filt svg { width: 20px; height: 20px; }

/* Brand circles */
.bc { display: grid; justify-items: center; gap: 6px; border: 0; background: none; padding: 0; font-size: 12px; font-weight: 500; color: var(--ink); width: 64px; }
.bc span { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; background: var(--soft); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.bc img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Promo carousel */
.promos { gap: 12px; }
.promo { position: relative; width: calc(100% - 28px); max-width: 360px; aspect-ratio: 16 / 10; border: 0; padding: 0; border-radius: 24px; overflow: hidden; text-align: left; color: #fff; background: #111; }
.promo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.promo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(10,14,40,.82) 0%, rgba(10,14,40,.45) 50%, rgba(10,14,40,0) 80%); }
.promo .pc-copy { position: absolute; z-index: 1; left: 20px; top: 20px; bottom: 18px; right: 40%; display: flex; flex-direction: column; gap: 4px; }
.promo .pc-copy small { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.promo .pc-copy strong { font-size: 1.35rem; line-height: 1.1; letter-spacing: -0.03em; }
.promo .pc-copy em { font-style: normal; font-size: 12.5px; opacity: .85; }
.promo .pc-copy b { margin-top: auto; align-self: flex-start; background: #fff; color: #0f1115; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; }

/* Section heads */
.sh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: -8px; }
.sh h2 { font-size: 1.2rem; }
.see { border: 0; background: none; padding: 0; font-size: 13.5px; font-weight: 600; color: var(--muted); }

/* Product cards */
.pc { display: grid; gap: 8px; min-width: 0; }
.cards .pc { width: 160px; }
.pc-media { position: relative; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--soft); }
.pc-media > button:first-child { all: unset; display: block; width: 100%; height: 100%; cursor: pointer; }
.pc-media > button:first-child:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pc-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.heart { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #0f1115; display: grid; place-items: center; }
.heart svg { width: 17px; height: 17px; }
.heart[aria-pressed="true"] { color: #e11d48; }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.tag { position: absolute; top: 10px; left: 10px; font-size: 10.5px; font-weight: 700; background: rgba(255,255,255,.94); color: #0f1115; border-radius: 999px; padding: 3px 9px; }
.tag.new { background: var(--accent); color: #fff; }
.pc-name { border: 0; background: none; padding: 0; text-align: left; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.pc-sub { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: -4px; }
.pc-price { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pc-price s { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
.dots { display: flex; gap: 3px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,.14); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
.empty-state { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 48px 12px; color: var(--muted); }
.empty-state .ei { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); color: var(--ink); }
.empty-state .ei svg { width: 26px; height: 26px; }
.empty-state strong { color: var(--ink); font-size: 1.05rem; }

/* Chips */
.chips { gap: 8px; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Categories */
.catgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ct { position: relative; aspect-ratio: 4 / 5; border: 0; padding: 0; border-radius: 22px; overflow: hidden; background: var(--soft); text-align: left; color: #fff; }
.ct img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ct::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,10,20,.72), rgba(8,10,20,0) 55%); }
.ct-txt { position: absolute; z-index: 1; left: 14px; bottom: 14px; right: 52px; display: grid; }
.ct-txt strong { font-size: 1.1rem; letter-spacing: -0.02em; line-height: 1.15; }
.ct-txt small { font-size: 12px; opacity: .8; }
.ct-go { position: absolute; z-index: 1; right: 12px; bottom: 12px; width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #0f1115; display: grid; place-items: center; }
.ct-go svg { width: 15px; height: 15px; }

/* Spotlight */
.story { position: relative; width: 100%; aspect-ratio: 4 / 5; border: 0; padding: 0; border-radius: 26px; overflow: hidden; text-align: left; color: #fff; background: #111; }
.story img { width: 100%; height: 100%; object-fit: cover; display: block; }
.story::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,8,20,.82), rgba(6,8,20,0) 58%); }
.st-copy { position: absolute; z-index: 1; left: 20px; right: 20px; bottom: 20px; display: grid; gap: 6px; }
.st-copy small { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.st-copy strong { font-size: 1.6rem; line-height: 1.08; letter-spacing: -0.035em; }
.st-copy span { font-size: 13.5px; opacity: .85; }
.st-copy b { margin-top: 6px; justify-self: start; background: #fff; color: #0f1115; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 999px; }

/* Product screen */
.pd-media { position: relative; aspect-ratio: 1 / 1; background: var(--soft); border-radius: 0 0 32px 32px; overflow: hidden; }
.pd-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fab { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.94); color: #0f1115; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.fab svg { width: 20px; height: 20px; }
.fab.l { left: max(16px, env(safe-area-inset-left, 0px)); }
.fab.r { right: max(16px, env(safe-area-inset-right, 0px)); }
.fab[aria-pressed="true"] { color: #e11d48; }
.fab[aria-pressed="true"] svg { fill: currentColor; }
.pd h1 { font-size: 1.75rem; line-height: 1.08; letter-spacing: -0.04em; margin-top: 6px; }
.pd-price { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: -10px; }
.pd-price s { font-size: .95rem; font-weight: 400; color: var(--muted); margin-left: 8px; }
.og { display: grid; gap: 10px; }
.og-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.og-h span:last-child { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 13px; }
.cc { display: flex; flex-wrap: wrap; gap: 8px; }
.cchip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; }
.cchip i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
.cchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ochip { height: 42px; min-width: 64px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ochip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.specs { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.specs li { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.specs li:last-child { border-bottom: 0; }
.specs li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.perks { display: grid; gap: 12px; }
.perk { display: flex; gap: 12px; align-items: center; font-size: 13.5px; color: var(--muted); }
.perk svg { width: 20px; height: 20px; color: var(--ink); flex: none; }
.perk strong { color: var(--ink); font-weight: 600; }
.buybar { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: min(430px, 100%); display: flex; align-items: center; gap: 16px; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(20px, env(safe-area-inset-left, 0px)); }
.buybar > div { display: grid; line-height: 1.2; }
.buybar small { font-size: 12px; color: var(--muted); }
.buybar strong { font-size: 1.1rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.buybar .btn { flex: 1; }

/* Tab bar */
.tabbar { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: min(398px, calc(100% - 32px)); height: 66px; padding: 0 8px; border-radius: 999px; display: flex; justify-content: space-between; align-items: center;
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); box-shadow: 0 0 0 1px var(--line), 0 12px 30px rgba(0,0,0,.12); }
.tb { position: relative; width: 50px; height: 50px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.tb svg { width: 22px; height: 22px; }
.tb[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tb .badge { top: 4px; right: 4px; }

/* Forms */
.form { display: grid; gap: 12px; }
.field { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.field:focus-within { border-color: var(--ink); }
.field:has(input[aria-invalid="true"]) { border-color: var(--danger); }
.field svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.field input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none; font-size: 15px; }
.field input::placeholder { color: var(--muted); }
.eye { border: 0; background: none; padding: 4px; color: var(--muted); display: grid; }
.form-err { font-size: 13px; color: var(--danger); margin: 0; }
.form-err:empty { display: none; }
.right { justify-self: end; font-size: 13px; text-decoration: none; }
.check { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--muted); }
.check input { accent-color: var(--accent); width: 18px; height: 18px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.flabel { display: grid; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.flabel .field { height: 50px; }

/* Auth */
.auth { padding-top: 40px; gap: 18px; }
.mark { font-weight: 700; font-size: 14px; letter-spacing: .6em; padding-left: .6em; text-align: center; }
.auth h1 { font-size: 2.3rem; line-height: 1.02; letter-spacing: -0.045em; margin-top: 24px; }
.auth h1 span { color: var(--accent); }
.or { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.switch { text-align: center; font-size: 14px; color: var(--muted); margin: 0; }

/* Cards and bag */
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.card h3 { font-size: 15px; letter-spacing: -0.01em; display: flex; justify-content: space-between; }
.card h3 span { color: var(--muted); font-weight: 500; }
.line { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
.line img { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; background: var(--soft); }
.line .ln { font-weight: 600; font-size: 14px; line-height: 1.3; }
.line .lm { font-size: 12.5px; color: var(--muted); }
.line .lr { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.line .lp { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; background: var(--soft); border-radius: 999px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qty button { width: 30px; height: 30px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; }
.qty button svg { width: 14px; height: 14px; }
.qty span { min-width: 18px; text-align: center; }
.mini { display: grid; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.mini div { display: flex; justify-content: space-between; gap: 12px; }
.mini div span:first-child { color: var(--muted); }
.mini div span:last-child { white-space: nowrap; }
.mini .t { font-weight: 700; font-size: 16px; padding-top: 8px; border-top: 1px solid var(--line); }
.mini .t span:first-child { color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; color: var(--muted); }
.steps li { border-top: 3px solid var(--line); padding-top: 6px; }
.steps li.on { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.payopt { display: grid; gap: 10px; border: 0; margin: 0; padding: 0; min-width: 0; }
.payopt legend { font-size: 13px; color: var(--muted); margin-bottom: 8px; padding: 0; }
.payopt label { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.payopt label:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.payopt input { margin-top: 3px; accent-color: var(--accent); }
.payopt strong { display: block; font-size: 14.5px; }
.payopt span { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 14px; padding: 12px 14px; margin: 0; }
.note strong { color: var(--ink); }
.bank { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 13.5px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
.bank dt { color: var(--muted); }

const USERS_KEY = "unboxd-users", SESSION_KEY = "unboxd-session";
let memUsers = {}, memSession = null;
function loadUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}") || {}; } catch (e) { return memUsers; } }
function saveUsers(u) { memUsers = u; try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch (e) {} }
function getSession() { try { return localStorage.getItem(SESSION_KEY) || memSession; } catch (e) { return memSession; } }
function setSession(email) { memSession = email; try { email ? localStorage.setItem(SESSION_KEY, email) : localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function currentUser() { const e = getSession(); const u = e && loadUsers()[e]; return u ? { email: e, ...u } : null; }
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
async function hashPw(pw, salt) { return hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw))); }
const newSalt = () => hex(crypto.getRandomValues(new Uint8Array(16)));
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const fmtDate = t => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const canHash = () => !!(window.crypto && crypto.subtle);
async function startDemo() {

  saveUsers(users); setSession("demo@unboxd.example");
  toast("You're in the demo account. Everything here is sample data.");
}

        <div style="display:flex;align-items:center;gap:12px"><button class="btn" type="submit" style="height:44px">Save address</button><span class="saved" id="adSaved" hidden>Saved</span></div>
      </form></section>
    <button class="btn full" type="button" data-a="tour">See the welcome tour</button>
    <button class="btn full" type="button" data-a="logout">Log out</button>
    ${confirmDelete ? `<div class="confirm" role="alert">Delete your account and order history from this device? This can't be undone.<div class="row"><button class="btn red" type="button" data-a="delyes">Delete</button><button class="btn" type="button" data-a="delno">Keep it</button></div></div>`
      : `<button class="danger" type="button" data-a="del">Delete account</button>`}
  </div>`;
}

// ---- Bag and checkout ----
function cartItems() {
  return Object.keys(cart).filter(k => cart[k] > 0).map(k => { const [id, s, f] = k.split("|"); const p = byId(id);
    return { key: k, p, s: +s, f: +f, name: p.name, finish: p.finishes[f][0], opt: p.opts.length > 1 ? p.opts[s][0] : "", qty: cart[k], price: p.opts[s][1] }; });
}
function sums(items) { const sub = items.reduce((t, i) => t + i.price * i.qty, 0); const ship = sub === 0 || sub >= 150000 ? 0 : 5000; return { sub, ship, total: sub + ship, n: items.reduce((n, i) => n + i.qty, 0) }; }
const miniHTML = t => `<div class="card mini"><div><span>Subtotal (${t.n} ${t.n === 1 ? "item" : "items"})</span><span>${money(t.sub)}</span></div><div><span>Delivery</span><span>${t.ship ? money(t.ship) : "Free"}</span></div><div class="t"><span>Total</span><span>${money(t.total)}</span></div></div>`;
const stepsHTML = i => `<ol class="steps" aria-label="Checkout steps">${["Delivery", "Payment", "Done"].map((s, j) => `<li class="${j <= i ? "on" : ""}"${j === i ? ' aria-current="step"' : ""}>${s}</li>`).join("")}</ol>`;
const PAY = {
  online: { label: "Pay online", sub: "Card, bank transfer or USSD on a secure payment page", btn: t => `Pay ${money(t)}` },
  transfer: { label: "Bank transfer", sub: "Send the total to our account. We confirm when it arrives.", btn: () => "I've made the transfer" },
  pod: { label: "Pay on delivery", sub: "Pay by card or transfer when your order arrives", btn: () => "Place order" },
};
function payDetail(kind, t) {
  if (kind === "online") return `<p class="note">You'll pay on a secure payment page by card, bank transfer or USSD. <strong>Demo:</strong> online payment isn't connected yet, so tapping Pay simulates a successful payment. No money is taken.</p>`;
  if (kind === "transfer") return `<dl class="bank"><dt>Bank</dt><dd>Your bank</dd><dt>Account name</dt><dd>Unboxd</dd><dt>Account number</dt><dd>0000000000</dd><dt>Amount</dt><dd>${money(t.total)}</dd><dt>Narration</dt><dd>${esc(draft.no)}</dd></dl><p class="note">These are placeholder bank details. Use your order number as the narration so the payment can be matched to your order.</p>`;
  return `<p class="note">Pay by card or bank transfer when the rider arrives. Your order is confirmed as soon as you place it.</p>`;
}
function bagHTML() {
  const u = currentUser();
  if (bagStep === "done" && lastOrder) {
    const o = lastOrder;
    const msg = o.status === "Paid" ? `We've received your payment. Your order will be delivered to ${esc(o.delivery.city)} in 2–4 days.`
      : o.status === "Awaiting transfer" ? `Transfer ${money(o.total)} with ${esc(o.no)} as the narration. We'll confirm your order as soon as the money arrives.`
      : `Pay ${money(o.total)} when your order arrives in ${esc(o.delivery.city)}, in 2–4 days.`;
    return `<div class="scr">${stepsHTML(2)}
      <div class="done"><span class="tick">${I.check}</span><h2>${o.status === "Paid" ? "Payment successful" : "Order placed"}</h2>
        <p>Order <strong>${esc(o.no)}</strong> · <span class="pill ${o.status === "Paid" ? "paid" : ""}">${esc(o.status)}</span></p><p>${msg}</p></div>
      <div class="card mini">${o.items.map(i => `<div><span>${esc(i.name)} · ${esc(i.finish)}${i.opt ? ", " + esc(i.opt) : ""}${i.qty > 1 ? " ×" + i.qty : ""}</span><span>${money(i.price * i.qty)}</span></div>`).join("")}<div class="t"><span>Total</span><span>${money(o.total)}</span></div></div>
      ${u ? `<button class="btn full" type="button" data-a="tab" data-t="account">View my orders</button>` : `<p class="muted" style="text-align:center">Create an account next time to keep track of your orders.</p>`}
      <button class="btn primary full" type="button" data-a="shopmore">Continue shopping</button></div>`;
  }
  const items = cartItems();
  if (!items.length) { bagStep = "cart"; return `<div class="scr"><div><div class="eyebrow">Your bag</div><h1 class="big">Bag</h1></div>
    <div class="empty-state"><span class="ei">${I.bag}</span><strong>Your bag is empty</strong>Find something you love and it'll show up here.<button class="btn primary" type="button" data-a="tab" data-t="home" style="margin-top:8px">Start shopping</button></div></div>`; }
  const t = sums(items);
  if (bagStep === "delivery") {
    const d = draft.delivery || { name: u ? u.name : "", phone: u ? u.phone : "", ...(u && u.address ? u.address : {}) };
    const fl = (id, label, ac, val, type = "text", ph = "") => `<label class="flabel">${label}<span class="field"><input id="${id}" type="${type}" autocomplete="${ac}" placeholder="${ph}" value="${esc(val)}"></span></label>`;
    return `<div class="scr">${headHTML("Delivery")}${stepsHTML(0)}
      ${u ? "" : `<p class="muted">Have an account? <button class="link" type="button" data-a="tab" data-t="account">Log in</button> to fill this in and keep a record of your order.</p>`}
      <form class="form" id="delForm" novalidate>
        ${fl("coName", "Full name", "name", d.name)}
        ${fl("coPhone", "Phone number", "tel", d.phone, "tel", "0801 234 5678")}
        ${fl("coLine", "Street address", "street-address", d.line)}
        <div class="two">${fl("coCity", "City", "address-level2", d.city)}${fl("coState", "State", "address-level1", d.state)}</div>
        ${u ? `<label class="check"><input type="checkbox" id="coSave" checked> Save this address to my account</label>` : ""}
        ${miniHTML(t)}
        <p class="form-err" id="coErr" role="alert"></p>
        <button class="btn primary full" type="submit">Continue to payment</button>
      </form></div>`;
  }
  if (bagStep === "payment") {
    if (!draft.no) draft.no = "UBX-" + Math.floor(10000 + Math.random() * 90000);
    const d = draft.delivery;
    return `<div class="scr">${headHTML("Payment")}${stepsHTML(1)}
      <p class="muted">Delivering to <strong>${esc(d.name)}</strong>, ${esc(d.line)}, ${esc(d.city)}. <button class="link" type="button" data-a="step" data-s="delivery">Change</button></p>
      <fieldset class="payopt"><legend>How would you like to pay?</legend>
        ${Object.entries(PAY).map(([k, o]) => `<label><input type="radio" name="pay" value="${k}" ${k === draft.pay ? "checked" : ""}><div><strong>${o.label}</strong><span>${o.sub}</span></div></label>`).join("")}</fieldset>
      ${payDetail(draft.pay, t)}
      ${miniHTML(t)}
      <button class="btn blue full" type="button" data-a="pay" id="payBtn">${PAY[draft.pay].btn(t.total)}</button></div>`;
  }
  return `<div class="scr"><div><div class="eyebrow">Your bag</div><h1 class="big">Bag</h1></div>
    <div class="card">${items.map(i => `<div class="line"><img src="${photo(i.p, i.f)}" alt="">
      <div><div class="ln">${esc(i.name)}</div><div class="lm">${esc(i.finish)}${i.opt ? " · " + esc(i.opt) : ""}</div>
      <div class="lr"><span class="qty"><button type="button" data-a="qty" data-k="${i.key}" data-d="-1" aria-label="Remove one">${I.minus}</button><span>${i.qty}</span><button type="button" data-a="qty" data-k="${i.key}" data-d="1" aria-label="Add one">${I.plus}</button></span><span class="lp">${money(i.price * i.qty)}</span></div></div></div>`).join("")}</div>
    ${miniHTML(t)}
    <p class="muted">${u ? `Logged in as ${esc(u.name)}. This order will be saved to your account.` : `<button class="link" type="button" data-a="tab" data-t="account">Log in</button> to save this order to your account, or check out as a guest.`}</p>
    <button class="btn primary full" type="button" data-a="step" data-s="delivery">Checkout · ${money(t.total)}</button></div>`;
}
function placeOrder(items, t) {
  const status = { online: "Paid", transfer: "Awaiting transfer", pod: "Pay on delivery" }[draft.pay];
  const order = { no: draft.no, date: Date.now(), items: items.map(({ name, finish, opt, qty, price }) => ({ name, finish, opt, qty, price })), total: t.total, status, method: PAY[draft.pay].label, delivery: draft.delivery };
  const u = currentUser();
  if (u) { const users = loadUsers(); users[u.email].orders = [...(users[u.email].orders || []), order]; saveUsers(users); }
  lastOrder = order; cart = {}; saveCart();
  draft = { delivery: null, pay: "online", no: null };
  bagStep = "done"; render();
}

// ---- Navigation ----
const TABS = [["home", "Home", I.home], ["cats", "Categories", I.grid], ["spot", "Spotlight", I.star], ["bag", "Bag", I.bag], ["account", "Account", I.user]];
const TAB_OF = { home: "home", search: "home", cats: "cats", list: "cats", spot: "spot", bag: "bag", account: "account" };
let curTab = "home";
function render(keepScroll = false) {
  const y = scrollY;
  $("#screen").dataset.view = view.name;
  $("#screen").innerHTML = SCREENS[view.name](view.params);
  const bar = !["splash", "welcome", "login", "product"].includes(view.name);
  $("#tabbar").hidden = !bar;
  if (TAB_OF[view.name]) curTab = TAB_OF[view.name];
  $("#tabbar").innerHTML = TABS.map(([k, l, ic]) => `<button class="tb" type="button" data-a="tab" data-t="${k}" aria-label="${l}"${k === curTab ? ' aria-current="page"' : ""}>${ic}${k === "bag" && cartCount() ? `<span class="badge">${cartCount()}</span>` : ""}</button>`).join("");
  window.scrollTo(0, keepScroll ? y : 0);
}
function go(name, params = {}) { stack.push({ ...view, y: scrollY }); view = { name, params }; render(); }
function back() { const prev = stack.pop() || { name: "home", params: {} }; view = prev; render(); if (prev.y) window.scrollTo(0, prev.y); }
function tab(t) { stack = []; if (t === "bag" && bagStep === "done") { bagStep = "cart"; lastOrder = null; } view = { name: t, params: {} }; render(); }

let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }
function fail(errSel, msg, inputId) { $(errSel).textContent = msg; if (inputId) { const i = $("#" + inputId); i.setAttribute("aria-invalid", "true"); i.focus(); } }
function finishWelcome() { store.set("unboxd-welcome-v2", 1); }
function afterAuth(msg) {
  toast(msg);
  if (view.name === "login") { stack = []; view = { name: "home", params: {} }; }
  render();
}

// ---- Actions ----
const A = {
  tab: el => tab(el.dataset.t),
  go: el => go(el.dataset.s),
  back: () => back(),
  list: el => { listSort = "featured"; go("list", { k: el.dataset.k }); },
  product: el => go("product", { id: el.dataset.id }),
  promo: el => { const [s, v] = PROMOS[+el.dataset.i].go; s === "product" ? go("product", { id: v }) : go("list", { k: v }); },
  sort: el => { listSort = el.dataset.v; render(true); },
  suggest: el => { view.params = { q: el.dataset.q }; render(); },
  bell: () => toast("You're all caught up. No new notifications."),
  save: el => {
    const id = el.dataset.id, p = byId(id);
    saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id];
    store.set("unboxd-saved", saved);
    const on = saved.includes(id);
    document.querySelectorAll(`[data-a="save"][data-id="${id}"]`).forEach(b => b.setAttribute("aria-pressed", on));
    toast(on ? `${p.name} saved` : `${p.name} removed from saved`);
  },
  pf: el => { pick[view.params.id].f = +el.dataset.i; render(true); },
  ps: el => { pick[view.params.id].s = +el.dataset.i; render(true); },
  add: el => {
    const p = byId(el.dataset.id), st = pick[p.id], key = `${p.id}|${st.s}|${st.f}`;
    cart[key] = (cart[key] || 0) + 1; saveCart(); if (bagStep === "done") { bagStep = "cart"; lastOrder = null; }
    el.textContent = "Added ✓"; toast(`${p.name} · ${p.finishes[st.f][0]} added to your bag`);
    setTimeout(() => back(), 650);
  },
  qty: el => { const k = el.dataset.k; cart[k] += +el.dataset.d; if (cart[k] <= 0) delete cart[k]; saveCart(); render(true); },
  step: el => { bagStep = el.dataset.s; render(); },
  pay: el => {
    const items = cartItems(); if (!items.length) return;
    const t = sums(items);
    if (draft.pay === "online") { el.classList.add("busy"); el.textContent = "Processing payment…"; setTimeout(() => placeOrder(items, t), 1500); }
    else placeOrder(items, t);
  },
  shopmore: () => { bagStep = "cart"; lastOrder = null; tab("home"); },
  obnext: el => {
    const i = +el.dataset.i;
    if (i >= 3) { finishWelcome(); if (currentUser()) { stack = []; view = { name: "home", params: {} }; } else { authMode = "signup"; view = { name: "login", params: {} }; } render(); return; }
    const tr = $("#obTrack"); tr.scrollTo({ left: i * tr.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  },
  obskip: () => { finishWelcome(); if (currentUser()) { stack = []; view = { name: "home", params: {} }; } else { authMode = "signin"; view = { name: "login", params: {} }; } render(); },
  tour: () => { stack = []; view = { name: "welcome", params: {} }; render(); },
  guest: () => { stack = []; view = { name: "home", params: {} }; render(); },
  mode: el => { authMode = el.dataset.m; render(); },
  eye: el => { const i = $("#auPw"), show = i.type === "password"; i.type = show ? "text" : "password"; el.setAttribute("aria-pressed", show); el.setAttribute("aria-label", show ? "Hide password" : "Show password"); },
  forgot: () => { $("#forgotMsg").hidden = false; },
  demo: async () => { await startDemo(); if (currentUser()) afterAuth("You're in the demo account. Everything here is sample data."); },
  logout: () => { setSession(null); confirmDelete = false; authMode = "signin"; toast("You're logged out."); tab("account"); },
  del: () => { confirmDelete = true; render(true); },
  delno: () => { confirmDelete = false; render(true); },
  delyes: () => { const users = loadUsers(); delete users[getSession()]; saveUsers(users); setSession(null); confirmDelete = false; authMode = "signup"; toast("Account deleted."); tab("account"); },
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el, e); } });
document.addEventListener("change", e => { if (e.target.name === "pay") { draft.pay = e.target.value; render(true); } });
document.addEventListener("input", e => { if (e.target.matches("input")) e.target.removeAttribute("aria-invalid"); });
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "homeSearch") { const q = $("#hq").value.trim(); go("search", { q }); setTimeout(() => { const s = $("#sq"); if (s && !q) s.focus(); }, 30); }
  if (id === "searchForm") { view.params = { q: $("#sq").value.trim() }; render(); }
  if (id === "authForm") {
    $("#auErr").textContent = "";
    const email = $("#auEmail").value.trim().toLowerCase(), pw = $("#auPw").value;
    if (authMode === "signup") {
      const name = $("#auName").value.trim(), phone = $("#auPhone").value.trim();
      if (!name) return fail("#auErr", "Enter your full name.", "auName");
      if (!emailOk(email)) return fail("#auErr", "Enter a full email address, like name@example.com.", "auEmail");
      if (pw.length < 8) return fail("#auErr", "Use a password with at least 8 characters.", "auPw");
      const users = loadUsers();
      if (users[email]) return fail("#auErr", "There's already an account with this email. Log in instead.", "auEmail");
      if (!canHash()) return fail("#auErr", "Accounts need a secure (https) connection.");
      const salt = newSalt();
      users[email] = { name, phone, salt, hash: await hashPw(pw, salt), address: null, orders: [], created: Date.now() };
      saveUsers(users); setSession(email); afterAuth(`Account created. Welcome to Unboxd, ${name.split(" ")[0]}.`);
    } else {
      if (!emailOk(email)) return fail("#auErr", "Enter the email you signed up with.", "auEmail");
      if (!pw) return fail("#auErr", "Enter your password.", "auPw");
      const u = loadUsers()[email];
      if (!u || !canHash() || await hashPw(pw, u.salt) !== u.hash) return fail("#auErr", "That email and password don't match an account.", "auPw");
      setSession(email); afterAuth(`Welcome back, ${u.name.split(" ")[0]}.`);
    }
  }
  if (id === "delForm") {
    $("#coErr").textContent = "";
    const d = { name: $("#coName").value.trim(), phone: $("#coPhone").value.trim(), line: $("#coLine").value.trim(), city: $("#coCity").value.trim(), state: $("#coState").value.trim() };
    if (!d.name) return fail("#coErr", "Enter the name of the person receiving the order.", "coName");
    if (d.phone.replace(/\D/g, "").length < 10) return fail("#coErr", "Enter a phone number the rider can call, like 0801 234 5678.", "coPhone");
    if (!d.line) return fail("#coErr", "Enter the street address for delivery.", "coLine");
    if (!d.city) return fail("#coErr", "Enter your city.", "coCity");
    if (!d.state) return fail("#coErr", "Enter your state.", "coState");
    draft.delivery = d;
    const u = currentUser();
    if (u && $("#coSave") && $("#coSave").checked) { const users = loadUsers(); users[u.email].address = { line: d.line, city: d.city, state: d.state }; if (!users[u.email].phone) users[u.email].phone = d.phone; saveUsers(users); }
    bagStep = "payment"; render();
  }
  if (id === "addrForm") {
    $("#adErr").textContent = "";
    const line = $("#adLine").value.trim(), city = $("#adCity").value.trim(), state = $("#adState").value.trim();
    if (!line) return fail("#adErr", "Enter your street address.", "adLine");
    if (!city) return fail("#adErr", "Enter your city.", "adCity");
    const users = loadUsers(); users[getSession()].address = { line, city, state }; saveUsers(users);
    const s = $("#adSaved"); s.hidden = false; setTimeout(() => { if (document.body.contains(s)) s.hidden = true; }, 1800);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && stack.length) back(); });

// ---- Start ----
{
  const first = !store.get("unboxd-welcome-v2", 0);
  view = { name: "splash", params: {} }; render();
  setTimeout(() => { if (view.name === "splash") { view = { name: first ? "welcome" : "home", params: {} }; render(); } }, first ? 1500 : 1100);
}
</script>
</body>
</html>
